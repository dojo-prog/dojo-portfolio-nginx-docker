services:
  backend-1:
    image: dojo-portfolio-backend
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - apps/backend/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/ready"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  backend-2:
    image: dojo-portfolio-backend
    env_file:
      - apps/backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/ready"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  web:
    image: dojo-portfolio-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - apps/web/.env.docker
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 80:80
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      web:
        condition: service_healthy

  postgres:
    image: postgres:18
    volumes:
      - postgres-data:/var/lib/postgresql
    env_file:
      - apps/backend/.env.docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dojo-portfolio -d dojo-portfolio"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
